schema_version: 1
name: fintech-ledger-app
version: 0.1.0
description: >-
  SaaS recipe for finance + ledger applications. Extends saas-multitenant-baseline
  with double-entry ledger schema, decimal-precision helpers, 7-year audit retention,
  and reconciliation runner placeholders. Cost discipline tightened (per ADR-0007).

extends: saas-multitenant-baseline

output_license: MIT
commercial_restricted_ok: false

composes: []

inputs_schema: inputs.zod.ts

# Inherits parent warehouses + adds finance-specific ones
warehouses:
  # Inherited from parent
  - architecture
  - auth
  - database
  - observability
  - security
  - dx
  # Finance-specific (Phase 7)
  - payments
  - billing

services:
  - id: web
    runtime: nextjs
    language: typescript
    host: vercel

qa_profile: thorough

# Finance workloads = tighter discipline. Per ADR-0007 + recipe DECISIONS.md.
cost_envelope:
  per_request_p50_usd: 0.001
  per_request_p99_usd: 0.01
  monthly_baseline_usd: 30
  hard_caps:
    per_request_usd: 0.10 # tighter than baseline because LLM use in finance = audit risk
    per_user_per_day_usd: 2
    per_app_per_day_usd: 50

model_families:
  - anthropic:opus

secrets_required:
  # Inherits all parent secrets
  - logical_name: supabase-anon-key
    op_path: op://Nexural/Supabase/anon-key
    target_file: .env.local
    target_var: NEXT_PUBLIC_SUPABASE_ANON_KEY
  - logical_name: supabase-service-role-key
    op_path: op://Nexural/Supabase/service-role-key
    target_file: .env.local
    target_var: SUPABASE_SERVICE_ROLE_KEY
  - logical_name: stripe-secret-key
    op_path: op://Nexural/Stripe/secret-key
    target_file: .env.local
    target_var: STRIPE_SECRET_KEY
  - logical_name: stripe-webhook-secret
    op_path: op://Nexural/Stripe/webhook-secret
    target_file: .env.local
    target_var: STRIPE_WEBHOOK_SECRET
  - logical_name: resend-api-key
    op_path: op://Nexural/Resend/api-key
    target_file: .env.local
    target_var: RESEND_API_KEY
  - logical_name: sentry-dsn
    op_path: op://Nexural/Sentry/dsn
    target_file: .env.local
    target_var: NEXT_PUBLIC_SENTRY_DSN
  - logical_name: posthog-api-key
    op_path: op://Nexural/PostHog/api-key
    target_file: .env.local
    target_var: NEXT_PUBLIC_POSTHOG_KEY

emit:
  template_path: templates/
  pre_emit_hooks: []
  post_emit_hooks: []

threat_model_path: THREAT_MODEL.md
decisions_path: DECISIONS.md

forge_sandbox:
  ignore_scripts: true
  allowed_postinstalls: []

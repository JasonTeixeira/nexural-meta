schema_version: 1
name: agent-workflow-app
version: 0.1.0
description: >-
  Agent workflow application for tool orchestration, human approval, run
  evidence, eval gates, and operator-visible failure handling.

extends: saas-multitenant-baseline
output_license: MIT
commercial_restricted_ok: false
composes: []
inputs_schema: inputs.zod.ts

warehouses:
  - architecture
  - auth
  - database
  - observability
  - security
  - dx
  - design
  - accessibility
  - performance
  - runbook
  - multi-tenancy
  - admin
  - analytics
  - agent
  - eval
  - prompt
  - model-routing
  - safety

services:
  - id: web
    runtime: nextjs
    language: typescript
    host: vercel

qa_profile: standard

cost_envelope:
  per_request_p50_usd: 0.01
  per_request_p99_usd: 0.10
  monthly_baseline_usd: 30
  hard_caps:
    per_request_usd: 0.50
    per_user_per_day_usd: 5
    per_app_per_day_usd: 100

model_families:
  - anthropic:opus
  - openai:flagship
  - ollama:llama-large

secrets_required:
  - logical_name: supabase-anon-key
    op_path: op://Nexural/Supabase/anon-key
    target_file: .env.local
    target_var: NEXT_PUBLIC_SUPABASE_ANON_KEY
  - logical_name: supabase-service-role-key
    op_path: op://Nexural/Supabase/service-role-key
    target_file: .env.local
    target_var: SUPABASE_SERVICE_ROLE_KEY
  - logical_name: anthropic-api-key
    op_path: op://Nexural/Anthropic/api-key
    target_file: .env.local
    target_var: ANTHROPIC_API_KEY
  - logical_name: openai-api-key
    op_path: op://Nexural/OpenAI/api-key
    target_file: .env.local
    target_var: OPENAI_API_KEY
  - logical_name: sentry-dsn
    op_path: op://Nexural/Sentry/dsn
    target_file: .env.local
    target_var: NEXT_PUBLIC_SENTRY_DSN
  - logical_name: posthog-api-key
    op_path: op://Nexural/PostHog/api-key
    target_file: .env.local
    target_var: NEXT_PUBLIC_POSTHOG_KEY

emit:
  template_path: templates/
  pre_emit_hooks: []
  post_emit_hooks: []

threat_model_path: THREAT_MODEL.md
decisions_path: DECISIONS.md

forge_sandbox:
  ignore_scripts: true
  allowed_postinstalls: []

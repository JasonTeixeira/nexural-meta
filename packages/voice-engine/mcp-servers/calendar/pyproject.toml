[project]
name = "nexural-mcp-calendar"
version = "0.1.0"
description = "Reference MCP server: calendar tools for voice agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.27,<2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
calendar-mcp = "calendar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_mcp"]

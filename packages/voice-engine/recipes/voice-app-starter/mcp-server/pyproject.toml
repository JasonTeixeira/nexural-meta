[project]
name = "myapp-mcp"
version = "0.1.0"
description = "Per-app MCP server. Rename for your app and add tools."
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = ["mcp>=1.27,<2.0", "pydantic>=2.7"]

[project.scripts]
myapp-mcp = "myapp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myapp_mcp"]

name: receptionist
description: |
  AI front-desk receptionist for any business. Answers basic questions,
  books appointments, takes messages, hands off to specialists. Telephony-
  ready out of the box (LiveKit SIP).
version: 1.0.0
mode: cascaded

system_prompt: |
  You are the front-desk receptionist for {{BUSINESS_NAME}}. Replace this
  placeholder per deployment via metadata.business_name.

  How you handle every call:
  1. Open warmly: "Thanks for calling [business]. How can I help?"
  2. Triage the request into one of: BOOKING, INFO, COMPLAINT, OTHER.
  3. For BOOKING: use the `calendar` MCP tool to find slots and book.
     Confirm name, phone, and reason. Read the time back.
  4. For INFO: use the `knowledge_base` MCP tool. If not found, take a
     message via `messages` MCP tool and tell them when they'll hear back.
  5. For COMPLAINT: never escalate emotionally. Acknowledge, log via
     `messages`, promise a callback from a manager within one business day.
  6. For OTHER: hand off to the right specialist if available, otherwise
     take a message.

  Hard rules:
  - Brief. Polite. Never robotic. Avoid corporate hold music phrases.
  - Confirm phone number digit-by-digit when taking it down.
  - If the caller sounds confused or elderly, slow down and offer to
    repeat anything.

greeting: |
  Thanks for calling. How can I help?

stt:
  provider: deepgram
  model: nova-3
  language: en
  keyterms: [appointment, booking, reservation, cancel, reschedule, manager]

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.3
  max_tokens: 350

tts:
  provider: cartesia
  model: sonic-3
  voice: 248be419-c632-4f23-adf1-5324ed7dbf1d

turn_detection:
  use_noise_cancellation: true
  use_semantic_turn_detector: false
  min_endpointing_delay: 0.3
  max_endpointing_delay: 5.0

memory:
  enabled: false # callers are usually new, not returning users
  user_id_strategy: room_name

orchestration:
  # On a multi-tenant deploy, list specialists this receptionist can
  # transfer to. Empty = take-a-message only.
  handoff_targets: []
  supervisor:
    enabled: false

mcp_servers:
  - name: calendar
    url: https://mcp.your-domain.com/calendar
  - name: knowledge_base
    url: https://mcp.your-domain.com/kb
  - name: messages
    url: https://mcp.your-domain.com/messages

# For COMPLAINT / OTHER, the receptionist emits a message record.
output_schema: call_message

metadata:
  product: receptionist
  channel: phone+web
  business_name: ACME Co.

name: sales_agent
description: |
  Outbound/inbound sales SDR. Qualifies, books meetings, handles common
  objections. Uses MCP for CRM (HubSpot/Salesforce) + calendar booking.
version: 1.0.0
mode: cascaded

system_prompt: |
  You are a top-tier inside sales rep for ACME. You're crisp, confident,
  warm, and you respect the prospect's time.

  On every call:
  1. Open with the reason for the call in one sentence.
  2. Ask one qualifying question.
  3. Listen.
  4. Confirm what you heard.
  5. Connect their need to ONE concrete piece of value.
  6. Ask for the next step (book a 20-min demo).

  Objection handling: acknowledge → ask one clarifying question → reframe.
  Never push past two reframes — log it and book a follow-up instead.

  Always use the CRM MCP server to:
  - lookup_contact at the start of the call
  - log_call_notes at the end
  - book_meeting when the prospect agrees

greeting: |
  Hi, this is Alex from ACME — do you have 30 seconds for me to tell you why
  I called?

stt:
  provider: deepgram
  model: nova-3
  language: en
  keyterms: [demo, pricing, ROI, budget, decision maker, integrate]

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.4 # consistent, on-message
  max_tokens: 400

tts:
  provider: elevenlabs
  model: eleven_flash_v2_5
  voice: 21m00Tcm4TlvDq8ikWAM # Rachel — replace with your brand voice

turn_detection:
  use_noise_cancellation: true
  use_semantic_turn_detector: false
  min_endpointing_delay: 0.3 # sales = fast turn-taking
  max_endpointing_delay: 4.0

memory:
  enabled: true
  user_id_strategy: participant_identity

mcp_servers:
  - name: crm
    url: https://mcp.your-domain.com/crm
  - name: calendar
    url: https://mcp.your-domain.com/calendar

# Every call emits a qualified-lead record.
output_schema: qualified_lead

metadata:
  product: sales-sdr
  tier: premium

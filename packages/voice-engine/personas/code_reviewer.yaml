name: code_reviewer
description: |
  Voice-driven code review companion. Engineer talks through their diff;
  reviewer asks the question a senior would, surfaces risks, suggests
  alternatives. Uses MCP for repo/diff/test tools. Supervisor enabled for
  deep architectural reasoning.
version: 1.0.0
mode: cascaded

system_prompt: |
  You are a senior staff engineer doing a voice-first code review.

  Procedure on every diff:
  1. Ask the engineer to summarise WHAT changed and WHY in two sentences.
  2. Use the `repo` MCP tool to read the diff. Quote the most important
     hunks aloud — just enough that the engineer can follow.
  3. Surface concerns in priority order: correctness > security >
     concurrency > performance > readability > style. Stop at the first
     blocker.
  4. Ask "what's the worst thing that happens if this is wrong in prod?" —
     and answer it with them.
  5. End with: one thing to fix before merge, one thing to consider for the
     next PR, one specific test to add.

  When stuck on a deep architectural call (e.g., "should this be in a
  worker or a serverless function?"), call `consult_supervisor` with a
  precise question — Claude Sonnet will answer in two sentences.

  Hard rules:
  - Never just say "looks good". Always find at least one concrete thing
    to improve.
  - Quote the line number when discussing code.
  - If the diff touches auth, secrets, billing, or migrations: explicitly
    flag it as high-risk and pause for the engineer's plan.

greeting: |
  Hey. What did you change, and what are you most worried about?

stt:
  provider: deepgram
  model: nova-3
  language: en
  keyterms: [diff, hunk, race, mutex, transaction, idempotent, migration, JWT]

llm:
  provider: anthropic
  model: claude-haiku-4-5 # fast voice; supervisor handles deep stuff
  temperature: 0.3
  max_tokens: 500

tts:
  provider: openai
  model: gpt-4o-mini-tts
  voice: ash
  instructions: |
    Speak as a calm senior engineer. Measured pace. Light technical
    confidence. Pause briefly before quoting code line numbers.

turn_detection:
  use_noise_cancellation: true
  use_semantic_turn_detector: true
  min_endpointing_delay: 0.5
  max_endpointing_delay: 8.0

memory:
  enabled: true
  user_id_strategy: participant_identity

orchestration:
  handoff_targets: []
  supervisor:
    enabled: true
    model: claude-sonnet-4-6
    temperature: 0.3

mcp_servers:
  - name: repo
    url: https://mcp.your-domain.com/repo

metadata:
  product: code-reviewer
  tier: premium

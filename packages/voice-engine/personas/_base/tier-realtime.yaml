# TIER: REALTIME — end-to-end speech-to-speech (OpenAI gpt-realtime).
# ~$4.80/hr. Most natural prosody. Use when emotional resonance is the
# product: therapist, meditation, storyteller, journaling, sleep coach,
# language coach, audiobook narrator.
extends: realtime.yaml

realtime:
  provider: openai
  model: gpt-realtime
  voice: marin # warm, calm. Alternatives: alloy (neutral), nova (warm), echo (deeper)
  temperature: 0.7

turn_detection:
  use_noise_cancellation: true
  use_semantic_turn_detector: false # realtime model handles EOU itself
  min_endpointing_delay: 0.6
  max_endpointing_delay: 10.0

memory:
  enabled: true
  user_id_strategy: participant_identity

metadata:
  tier: realtime
  cost_per_hour_estimate_usd: 4.80

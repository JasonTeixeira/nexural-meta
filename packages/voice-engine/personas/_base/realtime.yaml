# Base persona — realtime mode (end-to-end speech-to-speech).
# Inherit with `extends: _base/realtime.yaml`. Override anything.
name: _base_realtime
description: "(base persona — not for direct use)"
version: 1.0.0
mode: realtime

system_prompt: "(override in child)"

realtime:
  provider: openai
  model: gpt-realtime
  voice: marin
  temperature: 0.7

turn_detection:
  use_noise_cancellation: true
  use_semantic_turn_detector: false # realtime model handles it
  min_endpointing_delay: 0.6
  max_endpointing_delay: 10.0

memory:
  enabled: true
  user_id_strategy: participant_identity

orchestration:
  handoff_targets: []
  supervisor:
    enabled: false

recording:
  transcript: true
  audio: false
  telemetry: true

# TIER: FREE — runs entirely on provider free credits.
# ~$0/hr while credits last (~250 hours on $5 OpenAI credit alone).
# Use for prototypes, internal tools, demos, MVPs.
extends: cascaded.yaml

stt:
  provider: deepgram
  model: nova-3
  language: en

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 220

tts:
  provider: openai
  model: gpt-4o-mini-tts
  voice: nova
  instructions: |
    Speak naturally and conversationally. Use contractions and small
    pauses. Never sound like reading a script.

turn_detection:
  use_noise_cancellation: true
  use_semantic_turn_detector: false
  min_endpointing_delay: 0.3
  max_endpointing_delay: 4.0

memory:
  enabled: false # free tier: no mem0 hookup required
  user_id_strategy: participant_identity

metadata:
  tier: free
  cost_per_hour_estimate_usd: 0.78

# TIER: PREMIUM — lowest perceived latency + premium voice.
# ~$1.05/hr. Use when first impression matters: sales, receptionist,
# fitness coach, medical intake.
extends: cascaded.yaml

stt:
  provider: deepgram
  model: nova-3
  language: en

llm:
  # Stays on gpt-4o-mini — it's already excellent. Bump to gpt-4o for
  # personas where reasoning depth matters more than $/hr.
  provider: openai
  model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 350

tts:
  # Cartesia Sonic 3 = ~90ms TTFA, lowest in the industry. The "wow"
  # voice feel comes from this layer.
  provider: cartesia
  model: sonic-3
  voice: 248be419-c632-4f23-adf1-5324ed7dbf1d # default; clone your brand voice
  speed: 1.0

turn_detection:
  use_noise_cancellation: true
  use_semantic_turn_detector: false
  min_endpointing_delay: 0.25
  max_endpointing_delay: 3.5

memory:
  enabled: true
  user_id_strategy: participant_identity

metadata:
  tier: premium
  cost_per_hour_estimate_usd: 1.05

[project]
name = "nexural-voice-engine"
version = "0.1.0"
description = "Premium, reusable voice-agent engine. One core, infinite personas via YAML + MCP."
requires-python = ">=3.11"
authors = [{ name = "Sage", email = "sage@nexural.com" }]
license = { text = "UNLICENSED" }
readme = "README.md"

dependencies = [
    # ── Core ── pinned exact to LK Agents 1.5.12 release (voice plugin APIs
    # shift between minor versions; pinning prevents silent breaks).
    "livekit-agents[silero,turn-detector]==1.5.12",
    "livekit-api==1.1.0",
    "pydantic>=2.13,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "click>=8.1,<9.0",

    # ── Provider plugins ── pinned to match LK Agents 1.5.12
    "livekit-plugins-deepgram==1.5.12",
    "livekit-plugins-openai==1.5.12",
    "livekit-plugins-anthropic==1.5.12",
    "livekit-plugins-cartesia==1.5.12",
    "livekit-plugins-elevenlabs==1.5.12",
    "livekit-plugins-google==1.5.12",
    "livekit-plugins-silero==1.5.12",
    "livekit-plugins-noise-cancellation>=0.2.5,<0.3.0",

    # ── MCP (tools/content swap layer)
    "mcp>=1.27,<2.0",

    # ── Memory (cross-session)
    "mem0ai>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
nx-voice = "voice_engine.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

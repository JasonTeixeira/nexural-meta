name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # eslint left as warn for v0.1.0; turn to fail in v0.2.0 once codebase is shaped.

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: packages/*/coverage/

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: packages/*/dist/

  changeset-gate:
    # Per .changeset/README.md — every PR touching packages/*/src/ must include a changeset.
    if: github.event_name == 'pull_request'
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset:status --since=origin/main

  sbom-dry-run:
    # Generates an SBOM to verify the pipeline works.
    # Live SBOM gating happens at recipe forge time (per ADR-0006).
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - run: pnpm install --frozen-lockfile
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom.json --omit dev || echo "SBOM generation skipped on workspace-only repo"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.json
          if-no-files-found: ignore

  sigstore-dry-run:
    # Verifies cosign is wired in CI without actually signing anything.
    # Live signing fires on tag in publish.yml.
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: cosign version
        run: cosign version

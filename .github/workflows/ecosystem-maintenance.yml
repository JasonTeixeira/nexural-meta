name: Ecosystem maintenance

on:
  schedule:
    - cron: "0 9 * * *" # Nightly proof refresh.
    - cron: "0 10 * * 1" # Weekly proof review after the nightly refresh.
  workflow_dispatch:
    inputs:
      run_golden:
        description: "Run the local golden-path proof"
        type: boolean
        default: true
      run_deploy:
        description: "Deploy and verify the golden-path app when Vercel secrets exist"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run maintenance, proof refresh, and DB proof loop
        env:
          GH_TOKEN: ${{ secrets.SAGE_ECOSYSTEM_GITHUB_TOKEN || github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROOF_ALIAS: ${{ secrets.VERCEL_PROOF_ALIAS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
        run: |
          args="--allow-failures"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_golden }}" == "false" ]]; then
            args="$args --skip-golden"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_deploy }}" == "false" ]]; then
            args="$args --skip-deploy"
          fi
          pnpm ecosystem:maintain -- $args

      - name: Open PR if generated artifacts changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(ecosystem): phase 7 maintenance refresh"
          title: "chore(ecosystem): phase 7 maintenance refresh"
          body: |
            Automated Phase 7 maintenance refresh.

            This workflow regenerates the Sage Ideas Engineering OS registry,
            scorecard, resource map, recipe catalog, resource library,
            golden-path proof, proof environment lock, DB proof,
            public-safe packet, and maintenance report.

            If private repository totals look low, configure
            `SAGE_ECOSYSTEM_GITHUB_TOKEN` with read access across the ecosystem.
          branch: chore/ecosystem-maintenance
          delete-branch: true
          add-paths: |
            data/ecosystem-registry.public.json
            data/ecosystem-scorecard.public.json
            data/ecosystem-resource-map.public.json
            data/recipe-catalog.public.json
            data/resource-library.public.json
            data/golden-path-runs.public.json
            data/proof-environment.public.json
            data/db-proof.public.json
            data/public-proof-layer.public.json
            data/ecosystem-maintenance.public.json
            docs/ECOSYSTEM_INVENTORY.md
            docs/ECOSYSTEM_SCORECARD.md
            docs/ECOSYSTEM_RESOURCE_FACTORY.md
            docs/RECIPE_CATALOG.md
            docs/RESOURCE_LIBRARY.md
            docs/GOLDEN_PATH.md
            docs/PROOF_ENVIRONMENT.md
            docs/DB_PROOF.md
            docs/PUBLIC_PROOF_LAYER.md
            docs/ECOSYSTEM_MAINTENANCE.md
            evidence/gate-5/
            evidence/golden-path/
            evidence/proof-environment/
            evidence/db-proof/
            evidence/public-proof/
            evidence/maintenance/
            exports/proof-packet/

name: Ecosystem digest

on:
  schedule:
    - cron: "0 14 * * 5" # Friday 14:00 UTC (~10am ET)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run ecosystem digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ecosystem-digest.mjs

      - name: Commit + push digest
        run: |
          if [[ -n "$(git status --porcelain evidence/ecosystem/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add evidence/ecosystem/
            git commit -m "chore(ecosystem): weekly digest $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no changes to commit"
          fi
